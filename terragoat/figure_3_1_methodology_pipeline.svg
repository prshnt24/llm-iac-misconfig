<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="600" viewBox="0 0 2000 600"><rect width="100%" height="100%" fill="white"/><text x="60" y="65" font-family="Arial" font-size="38" fill="#18324a">Figure 3.1. Evaluation Pipeline</text><rect x="35" y="155" width="345" height="300" rx="22" fill="#e9f2fb" stroke="#31536f" stroke-width="3"/><text x="53" y="205" font-family="Arial" font-size="22" fill="#17354d">1. Dataset Collection</text><text x="53" y="270" font-family="Arial" font-size="20" fill="#263746">TerraGoat: 14 files</text><text x="53" y="312" font-family="Arial" font-size="20" fill="#263746">GitHub: 100?200 repos</text><text x="53" y="354" font-family="Arial" font-size="20" fill="#263746">Registry: 30?50 modules</text><line x1="385" y1="305" x2="425" y2="305" stroke="#31536f" stroke-width="8"/><polygon points="425,305 405,290 405,320" fill="#31536f"/><rect x="435" y="155" width="345" height="300" rx="22" fill="#e9f6ef" stroke="#31536f" stroke-width="3"/><text x="453" y="205" font-family="Arial" font-size="22" fill="#17354d">2. Ground Truth</text><text x="453" y="270" font-family="Arial" font-size="20" fill="#263746">Checkov v3.3.9 + Trivy</text><text x="453" y="312" font-family="Arial" font-size="20" fill="#263746">Retain agreed findings</text><line x1="785" y1="305" x2="825" y2="305" stroke="#31536f" stroke-width="8"/><polygon points="825,305 805,290 805,320" fill="#31536f"/><rect x="835" y="155" width="345" height="300" rx="22" fill="#fff4df" stroke="#31536f" stroke-width="3"/><text x="853" y="205" font-family="Arial" font-size="22" fill="#17354d">3. LLM Evaluation</text><text x="853" y="270" font-family="Arial" font-size="20" fill="#263746">GPT-4o, Claude Sonnet 4.6,</text><text x="853" y="312" font-family="Arial" font-size="20" fill="#263746">Gemini 2.5 Pro</text><text x="853" y="354" font-family="Arial" font-size="20" fill="#263746">Zero-shot and few-shot</text><line x1="1185" y1="305" x2="1225" y2="305" stroke="#31536f" stroke-width="8"/><polygon points="1225,305 1205,290 1205,320" fill="#31536f"/><rect x="1235" y="155" width="345" height="300" rx="22" fill="#f4edfb" stroke="#31536f" stroke-width="3"/><text x="1253" y="205" font-family="Arial" font-size="22" fill="#17354d">4. Response Parsing</text><text x="1253" y="270" font-family="Arial" font-size="20" fill="#263746">Policy ID mapping table</text><text x="1253" y="312" font-family="Arial" font-size="20" fill="#263746">Unmapped issues = false positives</text><line x1="1585" y1="305" x2="1625" y2="305" stroke="#31536f" stroke-width="8"/><polygon points="1625,305 1605,290 1605,320" fill="#31536f"/><rect x="1635" y="155" width="345" height="300" rx="22" fill="#e9f5f5" stroke="#31536f" stroke-width="3"/><text x="1653" y="205" font-family="Arial" font-size="22" fill="#17354d">5. Metric Calculation</text><text x="1653" y="270" font-family="Arial" font-size="20" fill="#263746">Precision, recall, F1</text><text x="1653" y="312" font-family="Arial" font-size="20" fill="#263746">Remediation rubric (0?2)</text></svg>